version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: agroai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agroai
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-agroai_root_pw}
    ports:
      - "3306:3306"
    volumes:
      - agroai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agroai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/agroai?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-agroai_root_pw}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: agroai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  agroai_mysql_data:
